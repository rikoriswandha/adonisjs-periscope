name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment (leave empty to let conventional commits decide)
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
        default: ''
      provenance:
        description: Publish with npm provenance (disable for registries without OIDC)
        required: false
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish package
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify package and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ inputs.provenance }}
        run: |
          npm run pack:test
          if [ -n "${{ inputs.increment }}" ]; then
            node scripts/release.mjs "${{ inputs.increment }}" --ci
          else
            node scripts/release.mjs --ci
          fi
