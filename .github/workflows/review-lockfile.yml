name: Prepare reviewed dependency lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    if: github.head_ref == 'codex/public-repo-review-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resolve compatible dependency fixes
        run: npm update @adonisjs/ace astro-icon @iconify/tools brace-expansion nanoid qs --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-package-lock
          path: package-lock.json
          retention-days: 3
