name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# One in-flight run per ref. A new push supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # `npm ci` must run install scripts: better-sqlite3 builds/fetches a
      # native binding here. The allow-list lives in /.npmrc — see the comment
      # in that file. Never add --ignore-scripts to any job below.
      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # `npm run typecheck` fans out to every workspace, and the playground is a
      # real consumer: it imports `@rikology/adonisjs-periscope/provider`,
      # `@rikology/adonisjs-periscope/services/recorder`, and `@rikology/adonisjs-periscope`, all of which resolve
      # into `build/`. On a clean checkout `build/` does not exist, so without this
      # step the job fails on unresolved modules rather than on a type error. Same
      # reason the test job below builds before running the playground suite.
      - name: Build periscope (the playground typechecks against the built package)
        run: npm -w @rikology/adonisjs-periscope run build

      - name: tsc --noEmit
        run: npm run typecheck

  test:
    # The package declares engines.node >= 24. 24 is the floor we promise;
    # 26 is the current release line and what contributors actually run.
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']

    # The storage contract suite runs against sqlite *and* postgres.
    # The `database` driver is dialect-neutral by design, and every difference that has ever
    # broken it — jsonb arriving already parsed, bigint arriving as a string, `count(*)` arriving
    # as a string, `on conflict` spelling — is invisible on sqlite. Without a real server the
    # postgres half of `tests/storage/database_store.spec.ts` skips itself and CI reports green
    # on half the coverage it claims.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: periscope
          POSTGRES_PASSWORD: periscope
          POSTGRES_DB: periscope
        ports:
          - 5432:5432
        # Steps start as soon as the container does, which is well before postgres accepts
        # connections; without the health check the first test run races the server's startup.
        options: >-
          --health-cmd "pg_isready -U periscope -d periscope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (packages/periscope)
        run: npm -w @rikology/adonisjs-periscope run test
        env:
          PERISCOPE_PG_URL: postgres://periscope:periscope@127.0.0.1:5432/periscope

      - name: Unit tests (packages/dashboard)
        run: npm -w @periscope/dashboard run test

      # The playground consumes `@rikology/adonisjs-periscope` through its published `exports` map, which
      # points at `build/`. Without this the app cannot even resolve
      # `@rikology/adonisjs-periscope/provider`, and every integration test fails on an import error rather
      # than on anything meaningful. The unit
      # tests above deliberately run first, against `src/`, so a compile problem is reported as a
      # compile problem.
      - name: Build periscope (the playground imports the built package)
        run: npm -w @rikology/adonisjs-periscope run build

      - name: Integration tests (playground, booted app)
        run: npm -w playground run test

  compatibility:
    # Prove the oldest supported and latest AdonisJS Core and Lucid releases still satisfy the
    # watcher contracts. The Cartesian matrix catches incompatibilities hidden by the repository
    # lockfile's single newest pair.
    name: Compatibility (Core ${{ matrix.adonis }}, Lucid ${{ matrix.lucid }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        adonis: ['7.0.0', 'latest']
        lucid: ['22.0.0', 'latest']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Core ${{ matrix.adonis }} and Lucid ${{ matrix.lucid }}
        shell: bash
        run: |
          npm pkg set "devDependencies.@adonisjs/core=${{ matrix.adonis }}" -w @rikology/adonisjs-periscope
          npm pkg set "dependencies.@adonisjs/core=${{ matrix.adonis }}" -w playground
          npm pkg set "devDependencies.@adonisjs/lucid=${{ matrix.lucid }}" -w @rikology/adonisjs-periscope
          npm pkg set "dependencies.@adonisjs/lucid=${{ matrix.lucid }}" -w playground
          npm install --package-lock=false

      - name: Build periscope (the playground imports the built package)
        run: npm -w @rikology/adonisjs-periscope run build

      - name: ModelWatcher functional spec (booted playground)
        run: npm -w playground test -- --files="functional/periscope_watchers.spec.ts"

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build package + dashboard
        run: npm run build

      # Inspect the artifact npm would publish, not merely the build directory. The script packs
      # from the package workspace and verifies every export target, the configure stubs, and the
      # dashboard entry and hashed assets against npm's actual files/ignore rules.
      - name: Verify published tarball contents
        run: npm run pack:test

  security:
    name: Security review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit shipped dependencies
        run: npm run security:audit

      - name: Provision playground env
        shell: bash
        run: |
          if [ -f playground/.env ]; then
            echo "playground/.env already present; leaving it untouched."
          elif [ -f playground/.env.example ]; then
            cp playground/.env.example playground/.env
          else
            echo "::error::playground/.env.example is missing; the security drill cannot boot."
            exit 1
          fi

      - name: Production gate and path-traversal drill
        run: npm run security:production

  performance:
    name: Performance gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Provision playground env
        shell: bash
        run: |
          if [ -f playground/.env ]; then
            echo "playground/.env already present; leaving it untouched."
          elif [ -f playground/.env.example ]; then
            cp playground/.env.example playground/.env
          else
            echo "::error::playground/.env.example is missing; the benchmark cannot boot."
            exit 1
          fi

      - name: Baseline, enabled load, record-path, and 10-minute soak
        run: npm run bench
        env:
          PERISCOPE_BENCH_DURATION_SECONDS: '30'
          PERISCOPE_SOAK_SECONDS: '600'
          PERISCOPE_SOAK_RPS: '200'
