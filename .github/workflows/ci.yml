name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# One in-flight run per ref. A new push supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # `npm ci` must run install scripts: better-sqlite3 builds/fetches a
      # native binding here. The allow-list lives in /.npmrc — see the comment
      # in that file. Never add --ignore-scripts to any job below.
      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # `npm run typecheck` fans out to every workspace, and the playground is a
      # real consumer: it imports `periscope/provider`, `periscope/services/recorder`
      # and `periscope`, all of which resolve through the package's `exports` map
      # into `build/`. On a clean checkout `build/` does not exist, so without this
      # step the job fails on unresolved modules rather than on a type error. Same
      # reason the test job below builds before running the playground suite.
      - name: Build periscope (the playground typechecks against the built package)
        run: npm -w periscope run build

      - name: tsc --noEmit
        run: npm run typecheck

  test:
    # The package declares engines.node >= 24. 24 is the floor we promise;
    # 26 is the current release line and what contributors actually run.
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']

    # Implementation plan P2.1: the storage contract suite runs against sqlite *and* postgres.
    # The `database` driver is dialect-neutral by design, and every difference that has ever
    # broken it — jsonb arriving already parsed, bigint arriving as a string, `count(*)` arriving
    # as a string, `on conflict` spelling — is invisible on sqlite. Without a real server the
    # postgres half of `tests/storage/database_store.spec.ts` skips itself and CI reports green
    # on half the coverage it claims.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: periscope
          POSTGRES_PASSWORD: periscope
          POSTGRES_DB: periscope
        ports:
          - 5432:5432
        # Steps start as soon as the container does, which is well before postgres accepts
        # connections; without the health check the first test run races the server's startup.
        options: >-
          --health-cmd "pg_isready -U periscope -d periscope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The playground is a real AdonisJS app: it refuses to boot without
      # APP_KEY and friends. `.env.test` is committed and layers on top of
      # `.env`, which may or may not be committed — provide it either way.
      - name: Provision playground env
        shell: bash
        run: |
          if [ -f playground/.env ]; then
            echo "playground/.env already present; leaving it untouched."
          elif [ -f playground/.env.example ]; then
            cp playground/.env.example playground/.env
            echo "Copied playground/.env.example -> playground/.env"
          else
            echo "::error::playground/.env.example is missing; the playground cannot boot."
            exit 1
          fi

      - name: Unit tests (packages/periscope)
        run: npm -w periscope run test
        env:
          PERISCOPE_PG_URL: postgres://periscope:periscope@127.0.0.1:5432/periscope

      - name: Unit tests (packages/dashboard)
        run: npm -w @periscope/dashboard run test

      # The playground consumes `periscope` through its published `exports` map, which points at
      # `build/`. Without this the app cannot even resolve `periscope/provider` and every
      # integration test fails on an import error rather than on anything meaningful. The unit
      # tests above deliberately run first, against `src/`, so a compile problem is reported as a
      # compile problem.
      - name: Build periscope (the playground imports the built package)
        run: npm -w periscope run build

      - name: Integration tests (playground, booted app)
        run: npm -w playground run test

  lucid-compatibility:
    # ModelWatcher is coupled to Lucid's hook and model contracts. Exercise the exact minimum
    # peer version as well as the newest release so compatibility regressions cannot hide behind
    # the lockfile's single resolved version.
    name: Lucid compatibility (${{ matrix.lucid }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lucid: ['22.0.0', 'latest']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Lucid ${{ matrix.lucid }} in package and playground
        shell: bash
        run: |
          npm pkg set "devDependencies.@adonisjs/lucid=${{ matrix.lucid }}" -w periscope
          npm pkg set "dependencies.@adonisjs/lucid=${{ matrix.lucid }}" -w playground
          npm install --package-lock=false

      # Keep this identical to the main test job: the focused functional spec boots the real
      # AdonisJS application and therefore needs the same environment contract.
      - name: Provision playground env
        shell: bash
        run: |
          if [ -f playground/.env ]; then
            echo "playground/.env already present; leaving it untouched."
          elif [ -f playground/.env.example ]; then
            cp playground/.env.example playground/.env
            echo "Copied playground/.env.example -> playground/.env"
          else
            echo "::error::playground/.env.example is missing; the playground cannot boot."
            exit 1
          fi

      - name: Build periscope (the playground imports the built package)
        run: npm -w periscope run build

      - name: ModelWatcher functional spec (booted playground)
        run: npm -w playground test -- --files="functional/periscope_watchers.spec.ts"

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build package + dashboard
        run: npm run build

      # Risk R6 / task P9.1: "dashboard assets missing from published tarball".
      # packages/dashboard builds into packages/periscope/build/dashboard, and
      # the package ships `files: ["build"]`. If the SPA build silently no-ops
      # or retargets its outDir, the published package serves a 404 dashboard
      # and nothing else in CI notices. This is the early, cheap version of the
      # gate; P9.1 replaces it with a real `npm pack` + tarball inspection.
      - name: Assert dashboard assets are in the build output
        shell: bash
        run: |
          asset="packages/periscope/build/dashboard/index.html"
          if [ ! -f "$asset" ]; then
            echo "::error file=packages/dashboard/vite.config.ts::$asset is missing after 'npm run build'. The dashboard SPA did not emit into the published package (risk R6)."
            echo "--- packages/periscope/build (top level) ---"
            ls -la packages/periscope/build || echo "build/ does not exist"
            exit 1
          fi
          echo "OK: $asset present ($(wc -c <"$asset") bytes)."

  security:
    name: Security review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit shipped dependencies
        run: npm run security:audit

      - name: Provision playground env
        shell: bash
        run: |
          if [ -f playground/.env ]; then
            echo "playground/.env already present; leaving it untouched."
          elif [ -f playground/.env.example ]; then
            cp playground/.env.example playground/.env
          else
            echo "::error::playground/.env.example is missing; the security drill cannot boot."
            exit 1
          fi

      - name: Production gate and path-traversal drill
        run: npm run security:production

  performance:
    name: Performance gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Provision playground env
        shell: bash
        run: |
          if [ -f playground/.env ]; then
            echo "playground/.env already present; leaving it untouched."
          elif [ -f playground/.env.example ]; then
            cp playground/.env.example playground/.env
          else
            echo "::error::playground/.env.example is missing; the benchmark cannot boot."
            exit 1
          fi

      - name: Baseline, enabled load, record-path, and 10-minute soak
        run: npm run bench
        env:
          PERISCOPE_BENCH_DURATION_SECONDS: '30'
          PERISCOPE_SOAK_SECONDS: '600'
          PERISCOPE_SOAK_RPS: '200'
