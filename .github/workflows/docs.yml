name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run docs:typecheck

      - name: Lint content
        run: npm run docs:lint

      - name: Build static site
        run: npm run docs:build

      - name: Upload static site
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: website/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy docs
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare
      url: ${{ vars.DOCS_SITE_URL || 'https://adonisjs-periscope.pages.dev' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: website/dist

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the cloudflare environment."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm -w website exec -- wrangler pages deploy dist --project-name adonisjs-periscope --branch main
